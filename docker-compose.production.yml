services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipo
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ["ipo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ipo:${POSTGRES_PASSWORD}@db:5432/ipo
      STRICT_RELIABILITY: "true"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    command: ["python","-m","app.worker"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ipo:${POSTGRES_PASSWORD}@db:5432/ipo
      STRICT_RELIABILITY: "true"
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: caddy:2.9-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
volumes:
  ipo_pg:
  caddy_data:
  caddy_config:
