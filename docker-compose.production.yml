services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipo
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ["ipo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  # Schema owner. Runs once per `docker compose up`, to completion, before web
  # and worker start - so exactly one process migrates (web and worker would
  # otherwise race each other on boot) and neither ever serves traffic against
  # a database that is behind the migration history. app.db.init_db() is a
  # deliberate no-op under APP_ENV=production for the same reason.
  migrate:
    build: .
    command: ["python","-m","alembic","upgrade","head"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ipo:${POSTGRES_PASSWORD}@db:5432/ipo
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ipo:${POSTGRES_PASSWORD}@db:5432/ipo
      STRICT_RELIABILITY: "true"
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    command: ["python","-m","app.worker"]
    # Default is 10s, which is not enough to finish an in-flight ingest step.
    # The worker traps SIGTERM and stops at its next checkpoint (see
    # app/worker.py) - this gives it room to get there instead of being
    # hard-killed mid-step.
    stop_grace_period: 60s
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ipo:${POSTGRES_PASSWORD}@db:5432/ipo
      STRICT_RELIABILITY: "true"
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  # Backups ship with the stack rather than living in a host crontab the
  # operator has to remember to add (and to re-add on any new machine).
  # Talks to Postgres as a plain client - no docker socket, no privileges.
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup_loop.sh:/usr/local/bin/backup_loop.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_loop.sh"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: caddy:2.9-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
volumes:
  ipo_pg:
  caddy_data:
  caddy_config:
