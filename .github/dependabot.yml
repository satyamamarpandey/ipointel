# Free, first-party dependency updates. Grouped and monthly on purpose: this
# is a small team, and a PR per package per week is how update fatigue starts
# and how real security bumps end up buried.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: {interval: "monthly"}
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "monthly"}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule: {interval: "monthly"}
