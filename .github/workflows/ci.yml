name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ipo_test
          POSTGRES_USER: ipo_test
          POSTGRES_PASSWORD: ipo_test_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ipo_test:ipo_test_ci_password@localhost:5432/ipo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: SQLite test suite
        run: pytest -q
      - name: Alembic upgrade against Postgres (proves the real migration path, not just create_all)
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
      - name: PostgreSQL test suite (same tests + Postgres-specific coverage)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Docker build validation
        run: docker build -t ipo-web-ci-check .
      - name: Docker Compose config validation
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.production.yml config -q

