<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — IPO Intelligence</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="authpage">
  <div class="authcard">
    <a class="navbrand" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" width="28" height="28"><path d="M11 6H7.6C7.05 6 6.6 6.45 6.6 7V25C6.6 25.55 7.05 26 7.6 26H11" stroke="#7ea8ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 6H24.4C24.95 6 25.4 6.45 25.4 7V25C25.4 25.55 24.95 26 24.4 26H21" stroke="#7ea8ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="12" width="4" height="8" rx="1.4" fill="#72e6c2"/></svg>
      <b>IPO<span>Intelligence</span></b>
    </a>
    <div class="waitcard" style="text-align:center;margin-top:10px">
      <h2 style="font-size:24px">Sign in to the terminal.</h2>
      <p style="margin-bottom:22px">Evidence-first IPO research for India and the United States.</p>

      <div id="socialProviders" class="authproviders" style="display:none;text-align:left">
        <button class="btn" id="googleBtn" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.56 2.66-3.86 2.66-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.95A9 9 0 000 9c0 1.45.35 2.83.95 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.42 0 9 0A9 9 0 00.95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
        <button class="btn" id="appleBtn" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true" fill="currentColor"><path d="M13.7 9.53c-.02-1.9 1.55-2.82 1.62-2.86-.88-1.29-2.26-1.47-2.75-1.49-1.17-.12-2.28.69-2.87.69-.6 0-1.5-.67-2.47-.65-1.27.02-2.44.74-3.1 1.87-1.32 2.29-.34 5.68.95 7.54.63.9 1.38 1.92 2.36 1.88.95-.04 1.31-.61 2.46-.61 1.14 0 1.47.61 2.47.59 1.02-.02 1.67-.92 2.29-1.83.72-1.05 1.02-2.07 1.03-2.12-.02-.01-1.98-.76-2-3.01zM11.79 3.5c.52-.63.87-1.5.77-2.37-.75.03-1.65.5-2.19 1.12-.48.55-.9 1.44-.79 2.28.83.06 1.68-.42 2.21-1.03z"/></svg>
          Continue with Apple
        </button>
      </div>
      <div id="authDivider" class="authdivider" style="display:none">or</div>

      <form id="loginForm">
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <button class="btn primary block" type="submit">Send sign-in link</button>
        <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
      </form>
      <p class="muted tiny" id="notBeta" style="margin-top:16px">Not on the beta yet? <a href="/#early-access">Join the waitlist</a>.</p>
    </div>
  </div>
</div>
<script src="/static/login.js"></script>
</body>
</html>
