<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — IPO Intelligence</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="appnav"><div class="container"><nav class="nav" style="padding-bottom:10px"><a class="brand" href="/" style="text-decoration:none">IPO<span>Intelligence</span></a><span class="pill">Admin</span></nav></div></header>
<main class="container appmain">
<div id="tokenGate" class="panel"><div class="panelhead"><h3>Admin token</h3></div><div class="detail">
<div class="field"><label for="tok">X-Admin-Token</label><input id="tok" type="password" autocomplete="off"></div>
<button id="tokSave" class="btn primary" type="button">Unlock admin</button>
<p class="muted" id="tokMsg"></p>
</div></div>

<div id="adminBody" style="display:none">
<div class="metricgrid">
<div class="metric"><span>Waitlisted</span><b id="mWait">—</b></div>
<div class="metric"><span>Invited</span><b id="mInvited">—</b></div>
<div class="metric"><span>Active</span><b id="mActive">—</b></div>
<div class="metric"><span>Disabled</span><b id="mDisabled">—</b></div>
<div class="metric"><span>Forward predictions</span><b id="mForward">—</b></div>
</div>
<div class="split">
<div class="panel"><div class="panelhead"><h3>Users</h3><span class="pill" id="userCount">0</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Email</th><th>Name</th><th>Market</th><th>Status</th><th>Signed up</th><th>Last login</th><th>Actions</th></tr></thead><tbody id="userRows"></tbody></table></div></div>
<aside class="panel"><div class="panelhead"><h3>Source health</h3></div><div id="srcHealth" class="detail"></div>
<div class="panelhead" style="margin-top:16px"><h3>Recent admin actions</h3></div><div id="auditRows" class="detail"></div>
</aside>
</div>
</div>
</main>
<script src="/static/admin.js"></script></body></html>
